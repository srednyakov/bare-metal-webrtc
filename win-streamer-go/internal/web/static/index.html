<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1rem;
    }
    #auth-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    h1 { font-size: 1.4rem; font-weight: 500; }
    input[type="password"] {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      font-size: 1rem;
      width: 220px;
    }
    button {
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      border: none;
      background: #3a7bd5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2f68be; }
    #status {
      font-size: 0.9rem;
      color: #888;
    }
    #video-section { display: none; width: 100%; }
    video {
      width: 100%;
      max-height: 100vh;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <div id="auth-section">
    <h1>Screen Stream</h1>
    <form id="auth-form">
      <input type="password" id="secret" placeholder="Secret" autocomplete="off" autofocus>
    </form>
    <button type="submit" form="auth-form">Connect</button>
    <p id="status">Enter secret to connect.</p>
  </div>

  <div id="video-section">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <script src="app.js"></script>
</body>
</html>
